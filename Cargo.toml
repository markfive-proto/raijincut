[package]
name = "raijincut"
version = "0.1.0"
edition = "2021"
description = "Parallel video processing CLI: thunder-fast editing powered by Rust"
authors = ["Kirito"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
