[package]
name = "raijincut"
version = "0.1.0"
edition = "2021"
description = "Parallel video processing CLI — thunder-fast editing powered by Rust"
authors = ["Kirito"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
ort = "2.0.0-rc.11"
image = "0.25"
ndarray = "0.16"
regex = "1.10"
tempfile = "3.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
