# Square Preset
# 1080x1080, 1:1, max 60s, h264

[video]
width = 1080
height = 1080
aspect_ratio = "1:1"
max_duration = 60
codec = "h264"
bitrate = "5M"
fps = 30
pixel_format = "yuv420p"

[subtitle]
font = "Arial"
font_size = 40
font_color = "#FFFFFF"
position = "bottom"
offset_y = 70
outline_color = "#000000"
outline_width = 2
background_color = "#00000080"
background_padding = 8
