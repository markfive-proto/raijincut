# Instagram Reels Preset
# 1080x1920, 9:16, max 90s, h264

[video]
width = 1080
height = 1920
aspect_ratio = "9:16"
max_duration = 90
codec = "h264"
bitrate = "6M"
fps = 30
pixel_format = "yuv420p"

[subtitle]
font = "Arial"
font_size = 48
font_color = "#FFFFFF"
position = "bottom"
offset_y = 150
outline_color = "#000000"
outline_width = 2
background_color = "#00000080"
background_padding = 10
